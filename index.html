<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Practice Tracker - Keluarga Santos</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 16px 16px 100px;
  }
  .header {
    text-align: center;
    margin-bottom: 16px;
    padding: 12px 0;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border-radius: 16px;
  }
  .header h1 {
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; }
  .profiles {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    justify-content: center;
  }
  .profile-btn {
    flex: 1;
    max-width: 110px;
    padding: 10px 6px;
    border-radius: 14px;
    border: 2px solid transparent;
    background: #1e293b;
    color: #e2e8f0;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: center;
  }
  .profile-btn.active {
    background: #3b82f6;
    border-color: #60a5fa;
  }
  .profile-btn .age { font-size: 0.65rem; opacity: 0.8; display: block; }
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .date-nav button {
    background: #1e293b;
    border: none;
    color: #e2e8f0;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .date-label {
    font-weight: 600;
    font-size: 1rem;
  }
  .export-btn {
    width: 100%;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border: none;
    padding: 14px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .note {
    text-align: center;
    color: #64748b;
    font-size: 0.75rem;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .challenge-card {
    background: #1e293b;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid #334155;
  }
  .challenge-card.completed {
    opacity: 0.65;
    border-color: #22c55e;
  }
  .challenge-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .challenge-title { font-weight: 700; font-size: 1rem; }
  .challenge-time { font-size: 0.75rem; color: #94a3b8; }
  .challenge-desc { color: #cbd5e1; font-size: 0.88rem; line-height: 1.45; margin-bottom: 12px; }
  .resources { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .resource-btn {
    background: rgba(59,130,246,0.15);
    color: #60a5fa;
    border: 1px solid rgba(59,130,246,0.3);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    text-decoration: none;
  }
  .actions { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .btn-complete { background: #22c55e; color: white; }
  .btn-complete:disabled { background: #334155; color: #94a3b8; }
  .btn-validate { background: #f59e0b; color: #000; }
  .btn-approve { background: #3b82f6; color: white; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 0.65rem;
    font-weight: 700;
    margin-left: 6px;
  }
  .badge-pending { background: #f59e0b; color: #000; }
  .badge-approved { background: #22c55e; color: #000; }
  .empty-state {
    text-align: center;
    color: #64748b;
    padding: 40px 20px;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🎸 Practice Tracker</h1>
  <p>Jazz Gospel · 30 menit sehari</p>
</div>

<div class="profiles" id="profiles"></div>

<div class="date-nav">
  <button onclick="changeDate(-1)">‹</button>
  <div class="date-label" id="dateLabel">Hari ini</div>
  <button onclick="changeDate(1)">›</button>
</div>

<button class="export-btn" onclick="exportReport()">
  📤 Export Laporan
</button>
<div class="note">Data tersimpan di HP ini saja · Export lalu kirim ke Ayah via WhatsApp</div>

<div id="challenges"></div>

<script>
const USERS = {
  david: { name: 'David', age: '48' },
  timothy: { name: 'Timothy', age: '14' },
  christopher: { name: 'Christopher', age: '10' }
};

const CHALLENGES = {
  david: [
    { id: 'd1', title: 'Warm-up + Minor Pentatonic', time: '8 menit', desc: 'Main A minor pentatonic posisi 5th fret naik-turun pelan, lalu main bebas di atas chord Am7. Target: nyaman dan tidak kaku.', yt: 'https://www.youtube.com/results?search_query=A+minor+pentatonic+guitar+position+5' },
    { id: 'd2', title: 'ii-V-I Chord Tones', time: '7 menit', desc: 'Latihan Dm7 – G7 – Cmaj7. Main arpeggio 1-3-5-7 di setiap chord. Landing di 3rd setiap pindah chord.', yt: 'https://www.youtube.com/results?search_query=ii-V-I+backing+track+C+major' },
    { id: 'd3', title: 'Improvisasi ii-V-I', time: '10 menit', desc: 'Putar backing track ii-V-I di C. Improvisasi pakai pentatonic + target 3rd. Rekam 1 take.', yt: 'https://www.youtube.com/results?search_query=ii-V-I+backing+track+gospel' },
    { id: 'd4', title: 'Aplikasi Lagu Gospel', time: '5 menit', desc: 'Pilih 1 lagu yang biasa dimainkan. Coba solo singkat 4 bar di bagian 1-4-5 atau ii-V.', yt: 'https://www.youtube.com/results?search_query=gospel+guitar+improvisation' }
  ],
  timothy: [
    { id: 't1', title: 'Chord Dasar + 7th', time: '8 menit', desc: 'Latihan C, G, Am, F dengan bersih. Lalu coba Cmaj7, G7, Am7. Fokus transisi yang smooth.', yt: 'https://www.youtube.com/results?search_query=basic+guitar+chords+for+beginners' },
    { id: 't2', title: 'Minor Pentatonic Sederhana', time: '7 menit', desc: 'Pelajari A minor pentatonic posisi 1. Main naik-turun 5 kali, lalu main bebas di atas 1 chord.', yt: 'https://www.youtube.com/results?search_query=minor+pentatonic+scale+guitar+beginner' },
    { id: 't3', title: 'Lagu Sederhana', time: '10 menit', desc: 'Main 1 lagu yang sudah dikuasai (Amazing Grace atau lagu gereja) dengan chord bersih. Coba tambah 1-2 note solo di akhir.', yt: 'https://www.youtube.com/results?search_query=amazing+grace+guitar+chords+easy' },
    { id: 't4', title: 'Tunjukkan ke Ayah', time: '5 menit', desc: 'Mainkan bagian terbaik hari ini di depan Ayah. Ayah yang akan validasi.', needsValidation: true }
  ],
  christopher: [
    { id: 'c1', title: 'Chord C, G, Am', time: '8 menit', desc: 'Latihan 3 chord ini bergantian. Main pelan dan bersih. Hitung 4 ketukan per chord.', yt: 'https://www.youtube.com/results?search_query=guitar+chords+C+G+Am+for+kids' },
    { id: 'c2', title: 'Lagu Twinkle atau Happy Birthday', time: '7 menit', desc: 'Main melodi sederhana di 1-2 senar. Bisa pakai tab dari YouTube.', yt: 'https://www.youtube.com/results?search_query=twinkle+twinkle+little+star+guitar+kids' },
    { id: 'c3', title: 'Main Bersama Ayah', time: '10 menit', desc: 'Main 1 lagu sederhana bersama Ayah. Fokus ke ritme yang sama.', yt: 'https://www.youtube.com/results?search_query=easy+worship+songs+guitar+kids' },
    { id: 'c4', title: 'Tunjukkan ke Ayah', time: '5 menit', desc: 'Perlihatkan apa yang sudah dipelajari hari ini. Ayah yang validasi.', needsValidation: true }
  ]
};

let currentUser = 'david';
let currentDate = new Date();
let data = JSON.parse(localStorage.getItem('santosMusicPractice') || '{"users":{}}');

function initData() {
  Object.keys(USERS).forEach(u => {
    if (!data.users[u]) data.users[u] = { completed: {}, validated: {} };
  });
  save();
}

function save() { localStorage.setItem('santosMusicPractice', JSON.stringify(data)); }

function getDateKey(d = currentDate) {
  return d.toISOString().split('T')[0];
}

function formatDateLabel(d) {
  const today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  if (d.toDateString() === today.toDateString()) return 'Hari ini';
  if (d.toDateString() === yesterday.toDateString()) return 'Kemarin';
  if (d.toDateString() === tomorrow.toDateString()) return 'Besok';
  return d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
}

function changeDate(delta) {
  currentDate.setDate(currentDate.getDate() + delta);
  document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);
  renderChallenges();
}

function renderProfiles() {
  document.getElementById('profiles').innerHTML = Object.entries(USERS).map(([key, u]) => `
    <button class="profile-btn ${key === currentUser ? 'active' : ''}" onclick="switchUser('${key}')">
      ${u.name}<span class="age">${u.age} th</span>
    </button>
  `).join('');
}

function renderChallenges() {
  const el = document.getElementById('challenges');
  const dateKey = getDateKey();
  const u = data.users[currentUser];
  const challenges = CHALLENGES[currentUser] || [];

  if (!challenges.length) {
    el.innerHTML = '<div class="empty-state">Belum ada challenge untuk profil ini.</div>';
    return;
  }

  let html = challenges.map(c => {
    const isDone = u.completed[c.id] === dateKey;
    const isValidated = u.validated[c.id] === dateKey;
    const needsVal = c.needsValidation && currentUser !== 'david';

    let actionBtn = '';
    if (needsVal) {
      if (isValidated) actionBtn = `<button class="btn btn-complete" disabled>✓ Disetujui Ayah</button>`;
      else if (isDone) actionBtn = `<button class="btn btn-validate" onclick="alert('Tunjukkan ke Ayah untuk divalidasi')">Menunggu Validasi</button>`;
      else actionBtn = `<button class="btn btn-complete" onclick="completeChallenge('${c.id}')">Selesai (Tunjukkan ke Ayah)</button>`;
    } else {
      actionBtn = `<button class="btn btn-complete" ${isDone ? 'disabled' : ''} onclick="completeChallenge('${c.id}')">${isDone ? '✓ Selesai' : 'Selesai'}</button>`;
    }

    return `
      <div class="challenge-card ${isDone ? 'completed' : ''}">
        <div class="challenge-header">
          <div class="challenge-title">${c.title}${needsVal && isDone && !isValidated ? '<span class="badge badge-pending">Menunggu</span>' : ''}${isValidated ? '<span class="badge badge-approved">Disetujui</span>' : ''}</div>
          <div class="challenge-time">${c.time}</div>
        </div>
        <div class="challenge-desc">${c.desc}</div>
        <div class="resources">
          ${c.yt ? `<a class="resource-btn" href="${c.yt}" target="_blank">▶️ Video YouTube</a>` : ''}
        </div>
        <div class="actions">${actionBtn}</div>
      </div>
    `;
  }).join('');

  // Pending validations for David
  if (currentUser === 'david') {
    let pending = '';
    ['timothy','christopher'].forEach(kid => {
      const kd = data.users[kid];
      CHALLENGES[kid].forEach(c => {
        if (kd.completed[c.id] === dateKey && !kd.validated[c.id]) {
          pending += `
            <div class="challenge-card" style="border-color:#f59e0b">
              <div class="challenge-header">
                <div class="challenge-title">${USERS[kid].name} — ${c.title}</div>
                <span class="badge badge-pending">Perlu Validasi</span>
              </div>
              <div class="challenge-desc">Anak sudah menandai selesai. Validasi setelah melihat mereka main.</div>
              <div class="actions"><button class="btn btn-approve" onclick="approveValidation('${kid}','${c.id}')">Setujui</button></div>
            </div>`;
        }
      });
    });
    if (pending) html = `<h3 style="margin:0 0 12px;color:#f59e0b;font-size:0.95rem">Validasi Anak</h3>` + pending + `<h3 style="margin:16px 0 12px;font-size:0.95rem">Challenge Saya</h3>` + html;
  }

  el.innerHTML = html;
}

function switchUser(user) {
  currentUser = user;
  renderProfiles();
  renderChallenges();
}

function completeChallenge(id) {
  const dateKey = getDateKey();
  data.users[currentUser].completed[id] = dateKey;
  save();
  renderChallenges();
}

function approveValidation(kid, id) {
  data.users[kid].validated[id] = getDateKey();
  save();
  renderChallenges();
  alert(`${USERS[kid].name} berhasil divalidasi!`);
}

function exportReport() {
  const dateKey = getDateKey();
  const label = formatDateLabel(currentDate);
  let report = `🎵 Laporan Latihan Musik - ${label}\n\n`;

  Object.entries(USERS).forEach(([key, u]) => {
    const userData = data.users[key];
    const challenges = CHALLENGES[key];
    const done = challenges.filter(c => userData.completed[c.id] === dateKey);
    const validated = challenges.filter(c => userData.validated[c.id] === dateKey);
    report += `👤 ${u.name}:\n`;
    if (done.length === 0) {
      report += `   Belum ada yang selesai\n`;
    } else {
      done.forEach(c => {
        const status = c.needsValidation ? (validated.find(v => v.id === c.id) ? '✓ Disetujui' : '⏳ Menunggu validasi') : '✓ Selesai';
        report += `   • ${c.title} — ${status}\n`;
      });
    }
    report += `\n`;
  });

  report += `Dikirim dari Practice Tracker Keluarga Santos`;

  if (navigator.share) {
    navigator.share({ title: 'Laporan Latihan Musik', text: report }).catch(() => copyToClipboard(report));
  } else {
    copyToClipboard(report);
  }
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    alert('Laporan sudah disalin!\nSekarang buka WhatsApp dan paste.');
  }).catch(() => {
    prompt('Salin teks ini:', text);
  });
}

initData();
document.getElementById('dateLabel').textContent = formatDateLabel(currentDate);
renderProfiles();
renderChallenges();
</script>
</body>
</html>
